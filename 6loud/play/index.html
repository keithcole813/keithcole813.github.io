/* ---------- asset loader: small batches, timeouts, retries ----------
   Firing 360 requests at once at a home server over a tunnel leaves most
   of them hanging forever — that was Keith's stuck-at-15% screen with no
   images (2026-11-06). Six in flight, 6 s timeout, 2 retries: the queue
   always drains. Core sets load first and open the start gate; the trick
   sets stream in behind them. */
const ANIM = {}; let animLoaded = 0, animTotal = 0, coreLoaded = 0, coreTotal = 0;
const CORE_MOVES = ['front', 'turn', 'run', 'basic', 'armsopen', 'diveroll'];
const loadQ = []; let inFlight = 0;
function queueImg(store, src, core) { animTotal++; if (core) coreTotal++; loadQ.push({ store, src, core, tries: 0 }); }
function pumpQ() {
  while (inFlight < 6 && loadQ.length) {
    const job = loadQ.shift(); inFlight++;
    const im = new Image(); job.store(im);
    let settled = false;
    const done = ok => { if (settled) return; settled = true; clearTimeout(job._to); inFlight--;
      if (ok) { animLoaded++; if (job.core) coreLoaded++; }
      else if (job.tries < 2) { job.tries++; loadQ.push(job); }
      else { animLoaded++; if (job.core) coreLoaded++; }   // gave up: count it, never stall the gate
      pumpQ(); };
    job._to = setTimeout(() => { try { im.src = ''; } catch (e) {} done(false); }, 6000);
    im.onload = () => done(true); im.onerror = () => done(false);
    im.src = job.src;
  }
}

    readyT += dt;
    if (readyT > 0.3 && Math.floor(time * 30) % MANIFEST.front.n === 0) {

  /* platforms */
  for (const p of plats) {
    const img = IMG['cloud' + p.img], cd = CLOUDS[p.img];
    if (!img || !img.naturalWidth) continue;
    const sx = p.x - camX, sy = p.y - camY;
    if (sx + p.len < -200 || sx > viewW / zoom + 200) continue;
    const dh = p.len * cd.asp;
    ctx.save();
    ctx.shadowColor = 'rgba(255,255,255,0.85)'; ctx.shadowBlur = 24;
    ctx.drawImage(img, sx, sy - cd.surf * dh + 6, p.len, dh);
    ctx.restore();
  }
  /* a low fog band softens everything the clouds sit in */
  const fogG = ctx.createLinearGradient(0, viewH / zoom * 0.55, 0, viewH / zoom);
  fogG.addColorStop(0, 'rgba(255,255,255,0)'); fogG.addColorStop(1, 'rgba(255,255,255,0.13)');
  ctx.fillStyle = fogG; ctx.fillRect(0, viewH / zoom * 0.55, viewW / zoom, viewH / zoom * 0.45);
  ctx.restore();
}

/* ---------- frame loop / sizing ---------- */
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (W >= H) { S = H / 1150; } else { S = W / 640; }
  viewW = W / S; viewH = H / S;
}
addEventListener('resize', resize);
let lastTs = 0;
function loop(ts) {
  const dt = Math.min(0.033, (ts - lastTs) / 1000 || 0.016); lastTs = ts;
  if (mode === 'title') titleFlow(dt);
  update(dt); draw();
  requestAnimationFrame(loop);
}
resize();
const best0 = JSON.parse(localStorage.getItem('sixloud_scores_ft') || '[]');
if (best0.length) $('best').textContent = 'BEST — ' + best0[0].n + ' · ' + Number(best0[0].s).toLocaleString('en-US') + ' FT';
fetchBoard();
requestAnimationFrame(loop);
</script>
</body>
