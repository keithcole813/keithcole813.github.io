<!DOCTYPE html>
<html lang="en">

<meta charset="utf-8">

<title>6LOUD — demo</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#17102e; overflow:hidden; }
  #c { display:block; width:100vw; height:100vh; touch-action:none; -webkit-user-select:none; user-select:none; }
  #ui { position:fixed; inset:0; pointer-events:none; font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif; color:#fff; }
  #hud { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:14px; right:14px; display:flex; justify-content:space-between; align-items:flex-start; }
  .hudbox { background:rgba(20,10,40,.38); border:2px solid rgba(255,255,255,.35); border-radius:12px; padding:6px 12px; }
  #score { font-size:30px; font-weight:900; letter-spacing:1px; line-height:1; text-shadow:0 2px 0 rgba(0,0,0,.35); }
  #score small { display:block; font-size:11px; font-weight:700; letter-spacing:2px; opacity:.85; }
  #dist { font-size:20px; font-weight:800; text-align:right; line-height:1.15; text-shadow:0 2px 0 rgba(0,0,0,.35); }
  #dist small { display:block; font-size:11px; font-weight:700; letter-spacing:2px; opacity:.85; }
  #flash { position:absolute; top:22%; width:100%; text-align:center; font-size:44px; font-weight:900; letter-spacing:2px; color:#ffd94d; text-shadow:0 3px 0 #b3541e, 0 6px 18px rgba(0,0,0,.4); opacity:0; }
  #center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; pointer-events:none; }
  #logo { width:min(62vw, 520px); filter:drop-shadow(0 10px 24px rgba(0,0,0,.45)); }
  #tap { margin-top:18px; font-size:clamp(20px,4.5vw,30px); font-weight:900; letter-spacing:2px; color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.4); animation:pulse 1.1s ease-in-out infinite; }
  #best { margin-top:10px; font-size:16px; font-weight:700; opacity:.92; text-shadow:0 2px 0 rgba(0,0,0,.4); }
  #over { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; background:rgba(15,8,35,.45); pointer-events:auto; }
  #over h1 { margin:0 0 4px; font-size:clamp(34px,8vw,58px); font-weight:900; letter-spacing:2px; color:#ffd94d; text-shadow:0 3px 0 #b3541e; }
  #overStats { font-size:20px; font-weight:800; margin-bottom:14px; text-shadow:0 2px 0 rgba(0,0,0,.5); }
  #board { font-size:17px; font-weight:700; line-height:1.5; margin-bottom:16px; text-shadow:0 2px 0 rgba(0,0,0,.5); }
  #nameRow { display:none; align-items:center; gap:8px; margin-bottom:16px; }
  #nameRow span { font-weight:900; letter-spacing:1px; }
  #ini { pointer-events:auto; width:110px; font-size:26px; font-weight:900; letter-spacing:6px; text-align:center; text-transform:uppercase;
         background:rgba(255,255,255,.12); color:#ffd94d; border:2px solid rgba(255,255,255,.5); border-radius:10px; padding:6px 4px; }
  .btn { pointer-events:auto; font-family:inherit; font-size:21px; font-weight:900; letter-spacing:1px; color:#3a1503;
         background:linear-gradient(#ffd94d,#ff9d3c); border:0; border-radius:999px; padding:12px 30px; box-shadow:0 5px 0 #b3541e, 0 10px 22px rgba(0,0,0,.35); }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 #b3541e; }
  @keyframes pulse { 0%,100% { transform:scale(1); opacity:1; } 50% { transform:scale(1.07); opacity:.85; } }
</style>
</head>

const ANIM = {}; let animLoaded = 0, animTotal = 0;
for (const mv of Object.keys(MANIFEST)) {
  ANIM[mv] = [];
  for (let i = 0; i < MANIFEST[mv].n; i++) {
    animTotal++;
    const im = new Image();
    im.onload = im.onerror = () => { animLoaded++; };
    im.src = 'assets/anim/' + mv + '/f' + String(i).padStart(3, '0') + '.webp';
    ANIM[mv].push(im);
  }
}
/* cloud platform art: measured surface line (fraction of drawn height) + aspect */
const CLOUDS = {
  '01':{surf:0.071, asp:0.264}, '11':{surf:0.191, asp:0.276}, '14':{surf:0.048, asp:0.262},
  '16':{surf:0.132, asp:0.295}, '17':{surf:0.172, asp:0.274}, '24':{surf:0.121, asp:0.324},
  '02':{surf:0.172, asp:0.378}, '12':{surf:0.081, asp:0.538}, '18':{surf:0.108, asp:0.434},
  '23':{surf:0.113, asp:0.440} };
const LONGC = ['01','11','14','16','17','24'], ISLAND = ['02','12','18','23'];
const WISPY = ['06','13','19','22'];
Object.keys(CLOUDS).concat(WISPY).forEach(n => loadImg('cloud'+n, 'assets/cloud-' + n + '.png'));

/* ---------- world constants (measured) ---------- */
const CHAR_H = 320;              // 6lade standing height in world units
const PX2U = CHAR_H / 400;          // the renders' canon: figure is 400 px tall
const GRAV = 5200;               // units / s^2
const BAND_Y = [0, -170, -340];  // LOW / MID / HIGH platform heights (relative)
const GAP = { TAP: 250, HOLD: 430, FULL: 590 };
const LEN = { LONG: 880, MED: 520, SHORT: 330, NEEDLE: 185 };

/* ---------- segment database (SEGMENTS.md, Keith-approved structure) ----------
   steps: [gapClass|null for first, lenClass, bandAfter] — band is absolute 0/1/2 */
const SEGMENTS = [
  {n:'Flat Cruise',  t:1, e:0, steps:[[null,'LONG',0],['TAP','LONG',0],['TAP','MED',0]]},
  {n:'Step Up',      t:1, e:2, steps:[[null,'MED',0],['TAP','MED',1],['TAP','MED',2],['TAP','LONG',2]]},
  {n:'Step Down',    t:1, e:0, steps:[[null,'MED',2],['TAP','MED',1],['TAP','LONG',0]]},
  {n:'Hopscotch',    t:1, e:1, steps:[[null,'SHORT',1],['TAP','SHORT',1],['TAP','SHORT',1],['TAP','MED',1]]},
  {n:'Long Bridge',  t:1, e:0, steps:[[null,'LONG',0],['TAP','LONG',0]]},
  {n:'Double Gap',   t:2, e:1, steps:[[null,'MED',1],['HOLD','SHORT',1],['HOLD','MED',1]]},
  {n:'High Shelf',   t:2, e:1, steps:[[null,'MED',1],['HOLD','LONG',2],['TAP','MED',1]]},
  {n:'Staircase',    t:2, e:0, steps:[[null,'SHORT',0],['HOLD','SHORT',1],['HOLD','SHORT',2],['HOLD','SHORT',1],['TAP','MED',0]]},
  {n:'Island Hop',   t:2, e:2, steps:[[null,'MED',1],['HOLD','MED',2],['HOLD','MED',1],['HOLD','MED',2]]},
  {n:'Tree Top',     t:2, e:1, steps:[[null,'MED',1],['HOLD','ISLE',1],['HOLD','MED',1]]},
  {n:'Mountain Pass',t:2, e:1, steps:[[null,'MED',1],['HOLD','ISLE',1],['TAP','LONG',1]]},
  {n:'Wide Void',    t:3, e:0, steps:[[null,'LONG',0],['FULL','LONG',0]]},
  {n:'Rapid Steps',  t:3, e:1, steps:[[null,'SHORT',1],['TAP','SHORT',2],['TAP','SHORT',1],['TAP','SHORT',2],['TAP','MED',1]]},
  {n:'Cloud Ladder', t:3, e:0, steps:[[null,'SHORT',0],['HOLD','SHORT',1],['HOLD','SHORT',2],['FULL','LONG',0]]},
  {n:'Needle Island',t:3, e:1, steps:[[null,'MED',1],['FULL','NEEDLE',1],['FULL','MED',1]]},
  {n:'Peak to Peak', t:3, e:2, steps:[[null,'ISLE',2],['FULL','ISLE',2],['HOLD','MED',1]]},
  {n:'Final Float',  t:3, e:1, steps:[[null,'LONG',1],['HOLD','SHORT',2],['FULL','SHORT',1],['HOLD','MED',2],['FULL','LONG',1]]}
];

/* ---------- state ---------- */
let W = 0, H = 0, S = 1, viewW = 0, viewH = 0;
let mode = 'title';            // title | run | over
let plats = [];                // {x, y(top), len, img}
let px = 0, py = 0, vy = 0;    // player feet position (world), y down-positive
let grounded = null;           // platform stood on
let speed = 620, dist = 0, score = 0, jumps = 0;
let charge = -1, held = false, airMove = null, airT = 0, spin = 0, landT = 0, hangT = 0, hangPlat = null;
let camX = 0, camY = 0, zoom = 1, shake = 0, time = 0, runTime = 0, lastSeg = -1, lastTier = 1, worldEnd = 0, exitBand = 0;
let flashTxt = '', flashT = 0, walkT = 0, dead = false;
const PLAYER_XF = 0.30;        // player screen position (fraction of view width)

/* ---------- sky (independent clock: sunset -> night -> sunrise) ---------- */
const SKY_KEYS = [ // [top, mid, low, horizon] per phase stop
  { t: 0.00, c: [[43,32,84],[178,74,116],[255,138,76],[255,196,110]], star: 0 },    // sunset
  { t: 0.36, c: [[24,20,58],[58,44,102],[104,66,120],[150,96,110]], star: 0.35 },   // dusk
  { t: 0.50, c: [[6,8,32],[14,18,54],[26,32,74],[40,48,92]], star: 1 },             // night
  { t: 0.78, c: [[10,12,44],[30,32,80],[70,58,104],[120,84,104]], star: 0.55 },     // late night
  { t: 0.90, c: [[52,40,92],[150,80,120],[240,130,90],[255,190,120]], star: 0.1 },  // sunrise
  { t: 1.00, c: [[43,32,84],[178,74,116],[255,138,76],[255,196,110]], star: 0 }     // back to sunset
];
const SKY_PERIOD = 75; // seconds per full cycle
let stars = [];
for (let i = 0; i < 130; i++) stars.push({ x: Math.random(), y: Math.random() * 0.62, r: Math.random() * 1.7 + 0.5, tw: Math.random() * 6.28 });
let meteor = null, meteorT = 4;
function skyAt(ph) {
  for (let i = 0; i < SKY_KEYS.length - 1; i++) {
    const a = SKY_KEYS[i], b = SKY_KEYS[i + 1];
    if (ph >= a.t && ph <= b.t) {
      const f = (ph - a.t) / Math.max(0.0001, b.t - a.t);
      const c = a.c.map((col, k) => col.map((v, j) => Math.round(v + (b.c[k][j] - v) * f)));
      return { c, star: a.star + (b.star - a.star) * f };
    }
  }
  return { c: SKY_KEYS[0].c, star: 0 };
}
/* dressing clouds drift on their own slow parallax */
let dress = [];
for (let i = 0; i < 7; i++) dress.push({ img: WISPY[i % WISPY.length], x: Math.random() * 2400, y: -80 - Math.random() * 700, w: 380 + Math.random() * 300, sp: 14 + Math.random() * 22 });

/* ---------- helpers ---------- */
const rnd = a => a[Math.floor(Math.random() * a.length)];
function flash(txt) { flashTxt = txt; flashT = 1.6; $('flash').textContent = txt; }

/* ---------- world building ---------- */
function addPlat(x, band, lenClass) {
  const isIsle = lenClass === 'ISLE';
  const len = isIsle ? 330 : LEN[lenClass];
  const img = isIsle ? rnd(ISLAND) : rnd(LONGC);
  plats.push({ x, y: BAND_Y[band], len, img });
  return x + len;
}
function buildSegment(seg) {
  let x = worldEnd;
  seg.steps.forEach((st, i) => {
    if (i > 0) x += GAP[st[0]];
    x = addPlat(x, st[2], st[1]);
  });
  worldEnd = x; exitBand = seg.e; lastTier = seg.t;
}
function nextSegment() {
  const pool = SEGMENTS.map((s, i) => ({ s, i })).filter(o =>
    o.i !== lastSeg && o.s.e === exitBand &&
    (runTime < 18 ? o.s.t === 1 : runTime < 45 ? o.s.t <= 2 : true) &&
    !(lastTier === 3 && o.s.t === 3));
  const o = rnd(pool.length ? pool : [{ s: SEGMENTS[0], i: 0 }]);
  lastSeg = o.i; buildSegment(o.s);
}
function resetWorld() {
  plats = []; worldEnd = 0; exitBand = 0; lastSeg = -1; lastTier = 1;
  addPlat(-300, 0, 'LONG'); worldEnd = -300 + LEN.LONG;
  buildSegment(SEGMENTS[0]); nextSegment(); nextSegment();
}

/* ---------- move pool (universal — same for every character) ----------
   Keith's curation: OUT jumping punch, jump attack, flying/jump kick
   (2026-11-05) and slam + jump over (2026-11-06, 'those look wrong').
   BASIC is the small hop trimmed from Arms Open (Keith 2026-11-06). */
function pickMove(c) {
  if (c < 0.20) return rnd(['basic', 'basic', 'armsopen']);
  if (c < 0.55) return rnd(['basic', 'armsopen', 'armsopen']);
  return rnd(['armsopen', 'runjump', 'diveroll', 'roll3', 'roll4']);
}
const MOVE_VY = { basic: -1560, armsopen: -1780, runjump: -1860, diveroll: -1840, roll3: -1760, roll4: -1800 };
const MOVE_NAME = { basic: 'BASIC JUMP', armsopen: 'ARMS OPEN', runjump: 'RUN & JUMP', diveroll: 'DIVE-ROLL', roll3: 'ROLL DODGE', roll4: 'ROLL DODGE' };
let airGrav = 1; // float baked in from the charge: longer hold = lighter gravity
let airTotal = 1; // estimated airtime of the current jump; the sequence time-scales to it

/* ---------- game flow ---------- */
function startRun() {
  resetWorld();
  px = 60; py = BAND_Y[0]; vy = 0; grounded = plats[0];
  speed = 620; dist = 0; score = 0; jumps = 0; runTime = 0;
  charge = -1; airMove = null; dead = false; hangPlat = null;
  camX = px - viewW * PLAYER_XF; camY = -560; zoom = 1; shake = 0;
  mode = 'run';
  $('center').style.display = 'none'; $('over').style.display = 'none';
  music.currentTime = 0; music.play().catch(() => {});
}
function gameOver() {
  mode = 'over'; dead = true;
  const best = JSON.parse(localStorage.getItem('sixloud_scores') || '[]');
  const qualifies = best.length < 5 || score > best[best.length - 1].s;
  $('overStats').textContent = 'SCORE ' + score + '  ·  ' + Math.floor(dist / 50) + 'm  ·  ' + jumps + ' JUMPS';
  $('board').innerHTML = best.map(b => b.n + ' — ' + b.s).join('<br>') || 'NO SCORES YET';
  $('nameRow').style.display = qualifies ? 'flex' : 'none';
  $('over').style.display = 'flex';
  if (qualifies) { $('ini').value = ''; setTimeout(() => $('ini').focus(), 60); }
  $('again').onclick = () => {
    if (qualifies) {
      const n = ($('ini').value || 'ACE').toUpperCase().slice(0, 3).padEnd(3, '·');
      best.push({ n, s: score }); best.sort((a, b) => b.s - a.s);
      localStorage.setItem('sixloud_scores', JSON.stringify(best.slice(0, 5)));
    }
    startRun();
  };
}

/* ---------- input: ONE button ---------- */
function press() {
  if (mode === 'title') { if (animLoaded >= animTotal) startRun(); return; }
  if (mode !== 'run' || dead) return;
  held = true;
  if (grounded && charge < 0) charge = 0;
}
function release() {
  held = false;
  if (mode !== 'run' || dead) return;
  if (grounded && charge >= 0) {
    const c = Math.min(1, charge);
    airMove = pickMove(c); jumps++; score += 1;
    if (c >= 0.55) score += 4;
    vy = MOVE_VY[airMove];
    airGrav = 1 - 0.32 * c;   // the hold IS the float (spec: hold = longer float)
    airTotal = 2 * Math.abs(vy) / (GRAV * airGrav);
    airT = 0; grounded = null; charge = -1;
    if (c >= 0.55) { zoom = Math.min(1.07, zoom + 0.05); flash(MOVE_NAME[airMove] + '!'); }
  }
}
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) press(); } });
addEventListener('keyup', e => { if (e.code === 'Space') release(); });
cv.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
addEventListener('pointerup', () => release());
addEventListener('pointercancel', () => release());

/* ---------- update ---------- */
function update(dt) {
  time += dt;
  if (mode !== 'run') return;
  runTime += dt;
  speed = Math.min(1150, 620 + runTime * 9);
  dist += speed * dt;
  const prevFeet = py;
  if (charge >= 0 && grounded) charge = Math.min(1, charge + dt / 0.55);
  /* horizontal: the world scrolls; player advances at speed */
  px += speed * dt;
  /* vertical physics */
  if (hangPlat) {
    hangT -= dt;
    py = hangPlat.y + 88; vy = 0;
    if (hangT <= 0) { py = hangPlat.y; grounded = hangPlat; hangPlat = null; flash('SAVED!'); }
  } else if (!grounded) {
    vy += GRAV * airGrav * dt; py += vy * dt; airT += dt;
    /* landing (with 16u lip assist) */
    for (const p of plats) {
      if (px + 68 < p.x || px - 36 > p.x + p.len) continue;
      const top = p.y;
      if (vy >= 0 && prevFeet <= top + 2 && py >= top) {
        py = top; const hard = vy > 2100; vy = 0; grounded = p; airMove = null; landT = 0.14;
        if (hard) { shake = Math.min(14, shake + 9); }
        break;
      }
    }
    /* ledge grab: falling short at the left edge (generous swept band) */
    if (!grounded) for (const p of plats) {
      if (px + 70 < p.x || px - 40 > p.x + p.len) continue;
      const top = p.y;
      if (vy > 260 && py > top + 10 && py < top + 175 && px + 62 > p.x && px + 62 < p.x + 150 && prevFeet < top + 175) {
        hangPlat = p; hangT = 0.30; score += 2; shake = Math.min(10, shake + 4);
        break;
      }
    }
    if (!grounded && !hangPlat && vy > 300) {
      /* near miss: skimming just under a lip we failed to grab */
      for (const p of plats) {
        if (Math.abs(px + 60 - p.x) < 14 && py > p.y + 96 && py < p.y + 150) { shake = Math.min(10, shake + 5); flash('CLOSE!'); break; }
      }
    }
  } else {
    py = grounded.y;
    if (px - 30 > grounded.x + grounded.len) { grounded = null; vy = 60; airMove = null; airT = 0; spin = 0; }
  }
  if (grounded) walkT += dt;
  if (landT > 0) landT -= dt;
  /* extend the world ahead, prune behind */
  while (worldEnd < camX + viewW + 900) nextSegment();
  while (plats.length && plats[0].x + plats[0].len < camX - 500) plats.shift();
  /* camera: follows, eases out as speed climbs, shake decays */
  const targetZoom = 1 - Math.min(0.12, (speed - 620) / 4400);
  zoom += (targetZoom - zoom) * Math.min(1, dt * 2.2);
  camX = px - (viewW / zoom) * PLAYER_XF;
  const wantY = py - viewH / zoom * 0.58;
  camY += (wantY - camY) * Math.min(1, dt * 5);
  shake = Math.max(0, shake - dt * 26);
  if (flashT > 0) { flashT -= dt; $('flash').style.opacity = Math.min(1, flashT); }
  $('score').innerHTML = '<small>SCORE</small>' + score;
  $('dist').innerHTML = '<small>DISTANCE</small>' + Math.floor(dist / 50) + 'm';
  if (py - camY > viewH / zoom + 260) gameOver();
}

/* ---------- draw ---------- */
function drawAnim(move, idx, cx, feetY) {
  const m = MANIFEST[move]; if (!m) return;
  const img = ANIM[move] && ANIM[move][idx];
  if (!img || !img.complete || !img.naturalWidth) return;
  const gap = m.gaps[idx];
  /* the cell row that sits on the feet line: the baked ground line, lifted
     whenever this frame's body reaches below it (rolls) so he rests ON the
     surface; airborne frames keep the ground line and float naturally. */
  const refRow = m.h - m.offset + Math.max(0, m.offset - gap);
  ctx.drawImage(img, cx - m.w * PX2U / 2, feetY - refRow * PX2U, m.w * PX2U, m.h * PX2U);
}
function playerAnim() {
  if (charge >= 0 && grounded) return { move: 'run', idx: 2, dip: charge * 12 };
  if (hangPlat) return { move: 'armsopen', idx: 5 };   // arms overhead on the lip
  if (!grounded) {
    if (airMove) {
      const m = MANIFEST[airMove];
      const f = Math.min(0.999, airT / Math.max(0.2, airTotal));
      return { move: airMove, idx: Math.floor(f * m.n) };
    }
    /* falling without a move (walked off an edge): arms-open descent frames */
    const m = MANIFEST.armsopen, base = Math.floor(m.n * 0.55);
    return { move: 'armsopen', idx: base + Math.floor(airT * 10) % (m.n - base) };
  }
  if (landT > 0) return { move: 'basic', idx: MANIFEST.basic.n - 3 };
  return { move: 'run', idx: Math.floor(walkT * 30) % MANIFEST.run.n };
}
function draw() {
  const ph = (time % SKY_PERIOD) / SKY_PERIOD;
  const sky = skyAt(ph);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `rgb(${sky.c[0]})`); g.addColorStop(0.45, `rgb(${sky.c[1]})`);
  g.addColorStop(0.75, `rgb(${sky.c[2]})`); g.addColorStop(1, `rgb(${sky.c[3]})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  /* stars */
  if (sky.star > 0.03) {
    for (const st of stars) {
      const a = sky.star * (0.55 + 0.45 * Math.sin(time * 2 + st.tw));
      ctx.fillStyle = `rgba(255,255,255,${Math.max(0, a)})`;
      ctx.fillRect(st.x * W, st.y * H, st.r, st.r);
    }
    meteorT -= 1 / 60;
    if (!meteor && meteorT <= 0 && sky.star > 0.7) { meteor = { x: Math.random() * W * 0.7, y: Math.random() * H * 0.25, v: 620 + Math.random() * 300 }; meteorT = 5 + Math.random() * 7; }
    if (meteor) {
      meteor.x += meteor.v / 60; meteor.y += meteor.v * 0.42 / 60;
      const gr = ctx.createLinearGradient(meteor.x, meteor.y, meteor.x - 90, meteor.y - 38);
      gr.addColorStop(0, 'rgba(255,255,255,.95)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = gr; ctx.lineWidth = 2.4; ctx.beginPath();
      ctx.moveTo(meteor.x, meteor.y); ctx.lineTo(meteor.x - 90, meteor.y - 38); ctx.stroke();
      if (meteor.x > W + 120) meteor = null;
    }
  }
  ctx.save();
  const shx = shake ? (Math.random() - 0.5) * shake : 0, shy = shake ? (Math.random() - 0.5) * shake : 0;
  ctx.translate(shx, shy);
  ctx.scale(S * zoom, S * zoom);
  /* dressing clouds (parallax, phase-tinted) */
  for (const d of dress) {
    const img = IMG['cloud' + d.img];
    if (!img || !img.naturalWidth) continue;
    let dx = (d.x - camX * 0.25) % (viewW / zoom + 700); if (dx < -700) dx += viewW / zoom + 700;
    const dy = d.y - camY * 0.25 + viewH / zoom * 0.55;
    ctx.save(); ctx.globalAlpha = 0.34 + sky.star * 0.1;
    ctx.drawImage(img, dx - 350, dy, d.w, d.w * img.naturalHeight / img.naturalWidth); ctx.restore();
  }
  /* platforms */
  for (const p of plats) {
    const img = IMG['cloud' + p.img], cd = CLOUDS[p.img];
    if (!img || !img.naturalWidth) continue;
    const sx = p.x - camX, sy = p.y - camY;
    if (sx + p.len < -200 || sx > viewW / zoom + 200) continue;
    const dh = p.len * cd.asp;
    ctx.drawImage(img, sx, sy - cd.surf * dh + 6, p.len, dh);
  }
  /* player: rendered sequences; on the title he runs in place */
  if (mode === 'title') {
    drawAnim('run', Math.floor(time * 30) % MANIFEST.run.n, viewW / zoom * 0.5, viewH / zoom * 0.62);
  } else {
    const pa = playerAnim();
    drawAnim(pa.move, pa.idx, px - camX, py - camY + 6 + (pa.dip || 0));
  }
  ctx.restore();
}

/* ---------- frame loop / sizing ---------- */
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (W >= H) { S = H / 1150; } else { S = W / 640; }
  viewW = W / S; viewH = H / S;
}
addEventListener('resize', resize);
let lastTs = 0;
function loop(ts) {
  const dt = Math.min(0.033, (ts - lastTs) / 1000 || 0.016); lastTs = ts;
  if (mode === 'title') $('tap').textContent = animLoaded >= animTotal ? 'TAP TO START' : 'LOADING ' + Math.floor(animLoaded / Math.max(1, animTotal) * 100) + '%';
  update(dt); draw();
  requestAnimationFrame(loop);
}
resize();
const best0 = JSON.parse(localStorage.getItem('sixloud_scores') || '[]');
if (best0.length) $('best').textContent = 'BEST — ' + best0[0].n + ' · ' + best0[0].s;
requestAnimationFrame(loop);
</script>
</body>
</html>
