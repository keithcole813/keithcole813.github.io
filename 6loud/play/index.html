  #startBtn { position:absolute; left:0; right:0; margin:0 auto; width:max-content; bottom:19vh; z-index:9; display:none; white-space:nowrap; pointer-events:auto; font-family:'Luckiest Guy',cursive; font-size:19px; letter-spacing:1px; color:#3a1503; background:linear-gradient(#ffd94d,#ff9d3c); border:2px solid #3a1503; border-radius:999px; padding:10px 28px; box-shadow:0 4px 0 #b3541e, 0 8px 18px rgba(0,0,0,.35); cursor:pointer; animation:pulse 1.1s ease-in-out infinite; }   /* centered by margin, NOT transform — the pulse keyframes animate transform:scale and ate the old translateX centering, throwing the button off the right edge (Keith's screenshot, v0.58) */

  @font-face { font-family:'Luckiest Guy'; font-style:normal; font-weight:400; font-display:swap; src:url(assets/fonts/luckiest-guy-latin.woff2) format('woff2'); unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  /* Fredoka — the HELPER text face (Gemini consult relayed by Keith, 2026-11-07): rounded and heavy like the clouds, kept separate from the HUD gold so an alert never reads as a counter */
  @font-face { font-family:'Fredoka'; font-style:normal; font-weight:600; font-display:swap; src:url(assets/fonts/fredoka-600.woff2) format('woff2'); }
  @font-face { font-family:'Fredoka'; font-style:normal; font-weight:700; font-display:swap; src:url(assets/fonts/fredoka-700.woff2) format('woff2'); }
  #loadbar { position:absolute; left:50%; bottom:11%; transform:translateX(-50%); width:min(78vw,520px);

<body>
<canvas id="c"></canvas>
<div id="ui">

  </div>
  <div id="pullup">PULL UP!!</div>
  <div id="dbl">DOUBLE JUMP!!</div>
  <div id="center">
    <div id="tap"></div>
  </div>
  <button id="charL" aria-label="Previous character"></button>

  <div id="loadbar"><div id="loadpct">LOADING 0%</div><div id="track"><div id="fill"><img id="cap" src="assets/cloud-01.webp" alt=""></div></div></div>
  <div id="over">
    <h1>WIPEOUT</h1>
    <div id="overStats"></div>
    <div id="board"></div>
    <div id="nameRow"><span>NEW BEST — YOUR INITIALS:</span><input id="ini" maxlength="3" autocomplete="off"></div>
    <button class="btn" id="again">TRY AGAIN</button>
    <button class="btn" id="titleBtn" style="margin-top:10px;">MAIN MENU</button>
  </div>
</div>
<audio id="music" src="assets/daylight.mp3" loop preload="auto"></audio>
<script>
'use strict';
/* ============================== 6LOUD demo v0.70.2 ==============================
   One-button endless runner. 6lade first, animated with true 30 fps rendered
   sequences from the UPDATED model (Keith's rulings 2026-11-05/06: cel look,
   swords on, no squeeze, no outdated sprites). Control (Keith 2026-11-06):
   press = jump NOW, the animation never stops; hold in the air = float and
   the air animation loops; still holding at the flip cue converts the jump
   to a spliced flip; a long hold converts the landing to a roll.
   Segments chain from the preset database; the sky runs on its own clock.      */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const music = $('music');
/* Music engine (v0.12) — WebAudio gains, because iOS Safari IGNORES the
   volume property on <audio> elements (media volume is locked to the
   hardware buttons): v0.11's "silenced second element" played BOTH loops
   out loud on Keith's iPhone. GainNodes are the level control iOS obeys.
   Both loops decode to buffers up front; the 1000 FT switch crossfades
   two already-running buffer sources — no element ever starts, stops or
   changes volume at the trigger. The <audio> element remains only as a
   no-WebAudio fallback (daylight track, no heat switch). */
let actx = null, bufD = null, bufB = null, srcD = null, srcB = null, gainD = null, gainB = null, heatOn = false;
let champMode = false, targetFt = 0;
let crownFlash = 0, bannerT = 0, moteT = 0, motes = [];
let flareT = 0;   /* the blue charge, borrowed: passing the ghost + full-charge releases (Keith v0.28) */
let surgeFlash = 0;   /* LaShmoove's surge: the whole-screen flash of light (Keith v0.32) */
function chargeFx(dur) { flareT = Math.max(flareT, dur); }
let altSm = 0, vhNow = 1150;
let camSmY = 0;   /* slow camera (v0.21): terrain + deep layers follow THIS, so hops don't pump them */
let camBgY = 0;   /* SLOWEST camera (v0.41): the background CLOUD layers follow this one — a ~4.5 s constant, so a hop can't move them at all; only a sustained climb can (Keith's rule, third report) */   /* smoothed altitude: sustained climbs move the deep layers; single hops average out (Keith v0.19.3) */   /* the crown celebration (Keith v0.15) */   /* the battle track is the CROWN track (Keith, v0.13): it starts the moment the high score breaks and keeps going for the rest of that run; the next run starts back on the original beat */
let rawD = null, rawB = null, rawS = null, bufS = null, srcS = null, gainS = null, decS = null;
/* AUDIO SCENES (Keith v0.34): every run OPENS on the footsteps — his snow-run
   loop — with NO bg music under them. At 1000 ft, or the moment 6lade starts
   GAINING on LaShmoove (the late drift, when he closes on the lead), the bg
   music comes in. When 6lade PASSES him (or breaks the crown), the 2nd bg
   music takes over. Steps and bg music NEVER play at the same time: one
   scene, one gain up. The steps themselves are ground-gated — feet on a
   cloud or silence — like real footsteps. */
const STEPS_VOL = 0.65;
let mScene = 'steps', passFired = false, stepsGateOn = null;
const MUSIC_VOL = 0.35;   /* bg music level, both tracks — pulled down from 0.5 (Keith v0.53); the steps (0.65) and the boom stays where it is, per his word */
const musV = () => MUSIC_VOL;   /* audio is simply ON (Keith v0.69: the sound controls are REMOVED — "the user just uses their phone"). There is no mute state anywhere anymore: the v0.53 toggle and its whole bug family (dead button, stuck silence, silent-after-death) are deleted, and these levels are constants the heartbeat can only ever re-assert as audible. */
const stpV = () => STEPS_VOL;
let pendingSave = null;   /* set by gameOver: saves a qualifying score before EITHER exit from the board screen (v0.64) */
let titleMusicOn = false;
function titleMusic() {   /* bg 1 on the character select screen (Keith v0.63: "Put bg1 at character selection screen since we have one now"). Browsers gate sound behind a gesture, so this is poked from the title's taps; the load-complete attempt is harmless where autoplay is blocked. */
  if (mode !== 'title') return;
  mScene = 'day'; titleMusicOn = true; playTrack();
}
let rawBoom = null, bufBoom = null, decBoom = null, gainBoom = null, boomT = 0, lastBoomT = -9;
function playBoom() {   /* Keith's cinematic boom: a CHARGED landing on a cloud (v0.33) */
  boomT++;   /* the trigger fired (the harness counts these even with no audio stack) */
  if (!actx || !bufBoom || actx.state !== 'running') return;   /* same proven route as the music: WebAudio only when it's alive */
  const now = actx.currentTime;
  if (now - lastBoomT < 0.4) return;   /* never machine-gun it */
  lastBoomT = now;
  if (!gainBoom) { gainBoom = actx.createGain(); gainBoom.gain.value = 0.86; gainBoom.connect(actx.destination); }   /* 1.35 x 0.8 — down 20% (Keith v0.42) */
  const src = actx.createBufferSource(); src.buffer = bufBoom; src.connect(gainBoom); src.start();
}
/* v0.13.4 — the silent-first-run fix (Keith: "music doesn't start when
   the game starts; it comes after I die and start over"). Cause: the
   AudioContext was created at page load, before any tap — iOS keeps a
   context born outside a user gesture suspended, so the first run's
   sources played into a frozen context; by the second run it had
   unlocked. Now: the MP3 bytes are fetched at boot (no context needed),
   and the context is created + decoded INSIDE the start tap, where iOS
   lets it run immediately. */
if (window.fetch) {
  fetch('assets/daylight.mp3').then(r => r.arrayBuffer()).then(b => { rawD = b; }).catch(() => {});
  fetch('assets/battle1000.mp3').then(r => r.arrayBuffer()).then(b => { rawB = b; }).catch(() => {});
  fetch('assets/boom.mp3').then(r => r.arrayBuffer()).then(b => { rawBoom = b; }).catch(() => {});
  fetch('assets/steps.mp3').then(r => r.arrayBuffer()).then(b => { rawS = b; }).catch(() => {});
}
/* v0.17.1 — the silent-first-run fix, second attempt (Keith: "audio
   still doesn't play until I die"). v0.13.4's flaw: it trusted the
   WebAudio context once buffers decoded — but on his iPhone the context
   sits inaudible through the whole first run while the code actively
   PAUSES the plain <audio> element, the one path that demonstrably
   works from the first tap. New rule: the element leads. WebAudio is
   used ONLY when the context reports state 'running' — proven alive —
   and every boundary (run start, crown moment) re-picks the route.
   kickDecode is non-blocking, decodes both tracks in parallel, and is
   also poked from press() so every jump tap gives the context another
   gesture to unlock with. */
let decD = null, decB = null;
function kickDecode() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  /* middle layer (ChatGPT: ~75%, crisp, slow) */
  for (const d of dressMid) {
    const img = BGIMG['m' + d.img];
    if (!img || !img.naturalWidth) continue;
    let dx = (((d.x - camX * 0.38) % 3450) + 3450) % 3450 - 820;   /* same fixed wrap — the mid layer was the worst sweeper (72 units of drag across the normal speed zoom-out alone) */
    const dy = d.y - camBgY * 0.38 + viewH / zoom * 0.55;   /* slow background camera (v0.41) — was instant camY: the mid clouds hopped with every jump */
    ctx.save(); ctx.globalAlpha = (0.74 + 0.20 * warmBg) * nightDim;
    ctx.drawImage(img, dx - 410, dy, d.w, d.w * img.naturalHeight / img.naturalWidth); ctx.restore();
  }
  for (const q of trail) { const la = Math.max(0, q.life / q.max);
    if (q.kind === 'fire' || q.kind === 'streakB' || q.kind === 'streakP') { const r = 15 + 22 * (1 - la); ctx.save(); ctx.globalAlpha = 0.55 * la; ctx.drawImage(q.kind === 'fire' ? puffImgF : q.kind === 'streakP' ? puffImgP : puffImgB, q.x - camX - r * 2.6, q.y - camY - r * 0.55, r * 5.2, r * 1.1); ctx.restore(); }   /* a streak, stretched long — gold for LaShmoove, blue for 6lade */   /* a golden streak, stretched long */
    else { const r = 12 + 30 * (1 - la); ctx.save(); ctx.globalAlpha = 0.5 * la; ctx.drawImage(q.kind === 'blue' ? puffImgB : q.kind === 'ember' ? puffImgF : q.kind === 'purple' ? puffImgP : puffImg, q.x - camX - r, q.y - camY - r, r * 2, r * 2); ctx.restore(); } }   /* the light trail, behind the runners */
  if (G && GR && GSKIN.man && (G.state === 'fall' || GR.perfD >= 0)) {   /* not drawn before his run starts — the player is still on the staircase (v0.47) */
    const gm = ghostMove(); const mv = gm.mv, idx = gm.idx;
    const m = GSKIN.man[mv], frames = GSKIN.anim[mv], gimg = frames && frames[idx];
    if (gimg && gimg.naturalWidth) {
      const gap = (m.gaps && m.gaps[idx]) || 0;
      const feetLine = (mv === 'diveroll' || mv === 'flip' || mv === 'diveflip' || mv === 'roll3' || mv === 'roll4')
        ? m.h - gap : m.h - m.offset + Math.max(0, m.offset - gap);   /* rolls anchor to the surface (Keith v0.31) */
      const K = PX2U / 0.82;   /* SAME SIZE (Keith, 2026-11-07): his frames are baked at 0.82 — dividing it back out puts him at true size on the same plane; the haze in the bake is what marks him as the ghost now, not a shrink */
      const fx = (G.state === 'fall' ? G.fallX : px + G.o) - camX, fy = (G.state === 'fall' ? G.fallY : GR.pyS + GSINK) - camY;
      if (GR.chgSm > 0.03) {   /* he was CHARGED here in his original run — his charge burns FIRE, not 6lade's blue (Keith v0.30) */
        ctx.save(); ctx.globalAlpha = 0.96 * G.fade * GR.chgSm;
        ctx.shadowColor = CHAR_FX[ghostChar()].halo; ctx.shadowBlur = 26 + 10 * Math.sin(time * 9);   /* the ghost burns in HIS character's color (v0.56) */
        ctx.drawImage(gimg, fx - m.w * K / 2, fy - feetLine * K, m.w * K, m.h * K); ctx.restore();
        if (GR.chgSm > 0.3) for (let k = 0; k < 7; k++) {   /* embers off him while he burns */
          const seed = k * 1.71, rise = (time * 0.85 + seed) % 1;
          ctx.save(); ctx.globalAlpha = 0.8 * GR.chgSm * (1 - rise);
          ctx.fillStyle = CHAR_FX[ghostChar()].ember(rise);
          ctx.beginPath(); ctx.arc(fx + Math.sin(seed * 7 + time * 2.6) * (16 + rise * 22), fy - 8 - rise * 165, 3.4 * (1 - rise) + 1, 0, 7); ctx.fill(); ctx.restore();
        }
      }
      ctx.save(); ctx.globalAlpha = 0.96 * G.fade;
      ctx.drawImage(gimg, fx - m.w * K / 2, fy - feetLine * K, m.w * K, m.h * K); ctx.restore();
    }
  }
  /* player: rendered sequences; on the title he runs in place */
  if (mode === 'title') {
    const cxT = viewW / zoom * 0.5, fyT = viewH / zoom * 0.62;
    const cimg = IMG['cloud01'], cd1 = CLOUDS['01'];
    /* v0.16.1 (Keith: "remove the double cloud") — the title drew cloud-01
       TWICE (a base copy + the front lip) and the two offset copies read
       as two stacked clouds. Only the lip remains: one cloud, and it
       still sinks his feet the 58 units that hide the front-run ankles. */
    if (loadState === 'turn') {
      const ti = Math.min(17, Math.floor((time - turnT0) * 30));
      const k = 1.2 - 0.4 * smooth01(ti / 17);   // title turn eases to the new 0.8 gameplay scale
      ctx.save(); ctx.translate(cxT, fyT); ctx.scale(k, k); ctx.translate(-cxT, -fyT);
      drawAnim('turn', ti, cxT, fyT); ctx.restore();
    } else if (loadState === 'done') {
      drawAnim('run', (18 + Math.floor((time - titleT0) * 30)) % PSKIN.man.run.n, cxT, fyT);
    } else {
      ctx.save(); ctx.translate(cxT, fyT); ctx.scale(1.2, 1.2); ctx.translate(-cxT, -fyT);   // front-run also 20% smaller
      drawAnim('front', Math.floor(time * 30) % PSKIN.man.front.n, cxT, fyT); ctx.restore();
    }
    /* front cloud lip OVER his feet (Keith 2026-11-06): the front-run
       ankles read twisted — sink his feet into the cloud and hide them. */
    if (cimg && cimg.naturalWidth) {
      const cw3 = 478, dh3 = cw3 * cd1.asp;
      ctx.save(); ctx.shadowColor = 'rgba(255,255,255,0.85)'; ctx.shadowBlur = 24;
      ctx.drawImage(cimg, cxT - cw3 / 2 - 6, fyT - 58 - cd1.surf * dh3, cw3, dh3); ctx.restore();
    }
  } else {
    const pa = playerAnim();
    if (champMode || flareT > 0) {
      /* the Shinobi Brawl blue charge (Keith v0.15): a pulsing electric
         halo pass under the clean sprite pass */
      ctx.save();
      ctx.shadowColor = CHAR_FX[selChar].halo;   /* the player's charge wears HIS color: fire for LaShmoove, blue for 6lade (v0.56) */
      ctx.shadowBlur = 30 + 12 * Math.sin(time * 9);
      drawAnim(pa.move, pa.idx, px - camX, py - camY + FEET + (pa.feetAdj || 0));
      ctx.restore();
      for (const m of motes) {
        ctx.save(); ctx.globalAlpha = 0.75 * Math.max(0, m.life / m.max);
        ctx.drawImage(puffFor(selChar), m.x - camX - m.r, m.y - camY - m.r, m.r * 2, m.r * 2); ctx.restore();
      }
    }
    drawAnim(pa.move, pa.idx, px - camX, py - camY + FEET + (pa.feetAdj || 0));
  }
  /* foot fog puffs (world-anchored, trailing behind him) */
  for (const q of puffs) {
    const la = Math.max(0, q.life / q.max);
    ctx.save();
    ctx.globalAlpha = 0.16 * la;   /* glow halo: the same soft puff stamped big + faint (Keith's glow) */
    ctx.drawImage(puffImg, q.x - camX - q.r * 2, q.y - camY - q.r * 2, q.r * 4, q.r * 4);
    ctx.globalAlpha = 0.55 * la;   /* the puff itself */
    ctx.drawImage(puffImg, q.x - camX - q.r, q.y - camY - q.r, q.r * 2, q.r * 2);
    ctx.restore();
  }
  /* platforms */
  for (const p of plats) {
    const img = IMG['cloud' + p.img], cd = CLOUDS[p.img];
    if (!img || !img.naturalWidth) continue;
    const sx = p.x - camX, sy = p.y + (p.sink || 0) - camY;
    if (sx + p.len < -200 || sx > viewW / zoom + 200) continue;
    const dh = p.len * cd.asp;
    ctx.save();
    ctx.shadowColor = `rgba(255,255,255,${0.85 - 0.35 * sky.star})`; ctx.shadowBlur = 24 - 10 * sky.star;   /* bloom tamed at night so the clouds keep their texture (v0.19) */
    if (Math.abs(p.tilt || 0) > 0.002) {   /* bent under the hanging man's weight — pivoting on the cloud's CENTER so his end dips (Keith v0.38) */
      const gx = p.x + p.len / 2 - camX, gy = p.y + (p.sink || 0) - camY;
      ctx.translate(gx, gy); ctx.rotate(p.tilt);
      ctx.drawImage(img, sx - gx, sy - cd.surf * dh + 6 - gy, p.len, dh);
    } else ctx.drawImage(img, sx, sy - cd.surf * dh + 6, p.len, dh);
    ctx.restore();
  }
  /* a low fog band softens everything the clouds sit in */
  const fogG = ctx.createLinearGradient(0, viewH / zoom * 0.55, 0, viewH / zoom);
  fogG.addColorStop(0, 'rgba(255,255,255,0)'); fogG.addColorStop(1, 'rgba(255,255,255,0.13)');
  ctx.fillStyle = fogG; ctx.fillRect(0, viewH / zoom * 0.55, viewW / zoom, viewH / zoom * 0.45);
  ctx.restore();
  /* the crown celebration, screen space: a full-screen flash, then the
     NEW HIGH SCORE banner in the game's own headline treatment (the
     WIPEOUT gold) — this is a record celebration Keith asked for, not
     an action callout */
  if (crownFlash > 0) {
    ctx.save(); ctx.globalAlpha = crownFlash * 0.5; ctx.fillStyle = '#fff6d8';
    ctx.fillRect(0, 0, W, H); ctx.restore();
  }
  if (surgeFlash > 0) {   /* LaShmoove's surge ignition: a flash of light across the whole screen (Keith v0.32) */
    ctx.save(); ctx.globalAlpha = surgeFlash * 0.6; ctx.fillStyle = '#fff3c4';
    ctx.fillRect(0, 0, W, H); ctx.restore();
  }
  if (bannerT > 0) {
    const inT = Math.min(1, (2.4 - bannerT) / 0.22);
    const sc = 0.7 + 0.3 * (1 - Math.pow(1 - inT, 3));
    ctx.save(); ctx.translate(W / 2, H * 0.30); ctx.scale(sc, sc);
    ctx.globalAlpha = Math.min(1, bannerT / 0.5);
    ctx.font = `${Math.round(Math.min(W * 0.115, 92))}px 'Luckiest Guy','Trebuchet MS',sans-serif`;   /* the display face (Keith's mock, v0.54) */
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 10; ctx.strokeStyle = '#5a2403'; ctx.strokeText('NEW HIGH SCORE', 0, 0);
    const grd = ctx.createLinearGradient(0, -42, 0, 42);
    grd.addColorStop(0, '#fff3b0'); grd.addColorStop(0.55, '#ffd94d'); grd.addColorStop(1, '#f39c2c');
    ctx.fillStyle = grd; ctx.fillText('NEW HIGH SCORE', 0, 0);
    ctx.restore();
  }
}

/* ---------- frame loop / sizing ---------- */
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  S = Math.min(W, H) / 1150;   // full mockup ratio (Keith 2026-11-06): short side = 1150 units, long side opens up
  viewW = W / S; viewH = H / S;
}
addEventListener('resize', resize);
let lastTs = 0;
let puShown = false, dbShown = false, charUiShown = true, hudShown = true, sbShown = false;
let audioBeat = 0;   /* the audio heartbeat clock (v0.67) */
function loop(ts) {
  const dt = Math.min(0.033, (ts - lastTs) / 1000 || 0.016); lastTs = ts;
  if (mode === 'title') titleFlow(dt);
  update(dt);
  const pu = !!hangPlat && !slipPlat;   /* PULL UP!! helper while he hangs (Keith v0.47) */
  if (pu !== puShown) { puShown = pu; $('pullup').style.display = pu ? 'block' : 'none'; }
  const db = mode === 'run' && !grounded && !hangPlat && !slipPlat && doubleArmed && !doubleUsed;   /* DOUBLE JUMP!! helper: on screen exactly while a mid-air tap would fire the double (Keith v0.70.1) */
  if (db !== dbShown) { dbShown = db; $('dbl').style.display = db ? 'block' : 'none'; }
  const cu = mode === 'title';   /* the carousel lives on the title screen only (v0.56) — it gets its OWN flag: it used to borrow mb (the sound toggle's), which was title-only until v0.60 made the toggle always-visible and silently kept the arrows + name on every screen (Keith's screenshots, fixed v0.65) */
  if (cu !== charUiShown) { charUiShown = cu; $('charL').style.display = cu ? 'block' : 'none'; $('charR').style.display = cu ? 'block' : 'none'; $('charName').style.display = cu ? 'block' : 'none'; $('charBest').style.display = cu ? 'block' : 'none'; $('strip').style.display = cu ? 'flex' : 'none'; }
  const sb = mode === 'title' && loadState === 'done';   /* START GAME shows only when the title is ready (v0.57) */
  if (sb !== sbShown) { sbShown = sb; $('startBtn').style.display = sb ? 'block' : 'none'; }
  const hd = mode !== 'over';   /* the DISTANCE plaque hides while the wipeout board is up (Keith 2026-11-07: it bled through behind WIPEOUT) */
  if (hd !== hudShown) { hudShown = hd; $('dist').style.display = hd ? 'block' : 'none'; }
  ghostUpdate(dt);   /* every mode: LaShmoove keeps his own time (v0.22) */ gateSteps();
  audioBeat += dt;   /* THE AUDIO HEARTBEAT (v0.67, Keith: "after you die and come back the audio is muted even with it set to play"): every half second the live scene re-asserts its routing. Death, the initials keyboard, an app switch, a suspended context resuming a beat late — every one of those could strand the gains or the element on the wrong side of a boundary, and a boundary-only design stays stranded until the NEXT boundary. playTrack is idempotent, so re-asserting it twice a second costs nothing and no stuck state survives longer than half a second. */
  if (audioBeat > 0.5) { audioBeat = 0; if (mode !== 'title' || titleMusicOn) playTrack(); }
  draw();
  requestAnimationFrame(loop);
}
resize();
/* the title's BEST line was removed (Keith v0.20: "remove the txt at
   the front that says who has the high score") — the boards still live
   on the wipeout screen; the front stays clean. */
fetchBoard();
requestAnimationFrame(loop);
</script>
