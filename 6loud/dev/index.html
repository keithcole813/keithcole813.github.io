  /* SHORT SCREENS (landscape): the WIPEOUT page shrinks to fit — ONLY this page (Keith v0.70.3). Portrait and tall screens keep the approved sizes untouched; where a very short screen still runs long, the page scrolls from the top instead of clipping both ends the way centering did. */

  #ver { text-align:center; font-size:13px; font-weight:700; letter-spacing:3px; color:rgba(255,255,255,.55); text-shadow:0 1px 6px rgba(0,0,0,.45); pointer-events:none; }

      ctx.fillStyle = 'rgba(10,6,32,0.66)'; ctx.beginPath(); ctx.roundRect(W / 2 - bw / 2, by, bw, 13, 7); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.roundRect(W / 2 - bw / 2 + 2, by + 2, (bw - 4) * Math.max(0, wingT / wingMax), 9, 5); ctx.fill();
      ctx.restore();
    }
  }
  if (coinT > 0 && mode === 'run') {   /* the coin's 10 seconds, draining at the top */
    const bw = Math.min(200, W * 0.4);
    ctx.save();
    ctx.fillStyle = 'rgba(10,6,32,0.66)'; ctx.beginPath(); ctx.roundRect(W / 2 - bw / 2, H * 0.068, bw, 13, 7); ctx.fill();
    ctx.fillStyle = '#ffd83d'; ctx.beginPath(); ctx.roundRect(W / 2 - bw / 2 + 2, H * 0.068 + 2, (bw - 4) * Math.max(0, coinT / 10), 9, 5); ctx.fill();
    ctx.restore();
  }
}

/* ---------- frame loop / sizing ---------- */
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  S = Math.min(W, H) / 1150;   // full mockup ratio (Keith 2026-11-06): short side = 1150 units, long side opens up
  viewW = W / S; viewH = H / S;
}
addEventListener('resize', resize);
let lastTs = 0;
let puShown = false, dbShown = false, charUiShown = null, hudShown = true, sbShown = false;   /* charUiShown starts NULL (v0.73.2): the sentinel makes the first frame APPLY the select cluster's state — hidden while loading (its elements are visible by CSS default), shown at 'done'. (v0.73.1's true->false fix cured the never-appearing strip; the null sentinel is what lets the cluster also start hidden.) */
let audioBeat = 0;   /* the audio heartbeat clock (v0.67) */
/* DEV FORK DEBUG OVERLAY (Keith, 2026-11-11): a live state readout pinned to
   the corner so a playtest SCREENSHOT carries the numbers with it — mode, fps,
   viewport, distance/score, vertical speed + air state, wings / magnet /
   charge, the ghost gap, the storm distance, and a rolling event log whose
   transitions are detected by polling (no hooks in the game's logic). */
const DBG_EV = [];
let dbgLastText = 0, dbgFrames = 0, dbgFpsT = 0, dbgFps = 0; const dbgPrev = {};
function dbgLog(s) { DBG_EV.push(s); if (DBG_EV.length > 6) DBG_EV.shift(); }
function dbgTick(ts) {
  dbgFrames++; if (ts - dbgFpsT >= 500) { dbgFps = Math.round(dbgFrames * 1000 / Math.max(1, ts - dbgFpsT)); dbgFrames = 0; dbgFpsT = ts; }
  const P = dbgPrev, wingOn = wingT > 0, magOn = magT > 0, hangOn = !!hangPlat;
  if (P.mode !== undefined && P.mode !== mode) { if (mode === 'over') dbgLog('DEATH ' + Math.round(runFt()) + ' FT'); if (mode === 'run') dbgLog('RUN START ' + selChar); }
  if (P.wingOn !== undefined && wingOn !== P.wingOn) dbgLog(wingOn ? 'WING ' + String(wingKind).toUpperCase() + ' ON' : 'WING OFF');
  if (P.magOn !== undefined && magOn !== P.magOn) dbgLog(magOn ? 'MAGNET ON' : 'MAGNET OFF');
  if (P.hangOn !== undefined && hangOn !== P.hangOn) dbgLog(hangOn ? 'HANG' : 'HANG OFF');
  if (P.stormAt !== undefined && stormAt !== P.stormAt && mode === 'run') dbgLog('STORM BANK');
  if (G && P.gState !== undefined && G.state !== P.gState && G.state === 'fall') dbgLog('GHOST DOWN');
  P.mode = mode; P.wingOn = wingOn; P.magOn = magOn; P.hangOn = hangOn; P.stormAt = stormAt; P.gState = G ? G.state : null;
  if (ts - dbgLastText < 120) return; dbgLastText = ts;
  const ghostTxt = 'GHOST ' + (RACE ? ghostChar() + ' ' + (GR && GR.style ? GR.style : '') + ' gap ' + (G ? Math.round(G.o) : '-') + ' perf ' + (GR && GR.perfD != null ? Math.round(GR.perfD / 15.24) : '-') : 'none') + ' · STORM in ' + Math.max(0, Math.round((stormAt - dist) / 15.24)) + ' FT';
  if (mode === 'over') {   /* DEV FORK: on the results screen the readout SHRINKS to a two-line strip docked at the very bottom — the full panel was sprawled over the leaderboard (Keith's screenshot, 2026-11-11) */
    const el = $('dbg');
    el.style.top = 'auto'; el.style.bottom = 'calc(4px + env(safe-area-inset-bottom))'; el.style.fontSize = '9.5px';
    el.textContent = 'FORK9 · OVER · ' + dbgFps + 'fps · ' + innerWidth + 'x' + innerHeight + ' · ' + selChar + ' R' + (PSKIN.rate || 1) + ' · DIST ' + Math.round(runFt()) + ' FT · SCR ' + score + ' · JMP ' + jumps + '\n' + ghostTxt + (DBG_EV.length ? ' · ' + DBG_EV[DBG_EV.length - 1] : '');
    return;
  }
  const el = $('dbg'); el.style.top = ''; el.style.bottom = ''; el.style.fontSize = '';
  const lines = [
    'FORK9 · ' + String(mode).toUpperCase() + ' · ' + dbgFps + 'fps · ' + innerWidth + 'x' + innerHeight + ' dpr' + (devicePixelRatio || 1),
    'CHR ' + selChar + ' R' + (PSKIN.rate || 1) + ' · SPD ' + Math.round(speed) + ' · ZOOM ' + zoom.toFixed(2),
    'DIST ' + Math.round(runFt()) + ' FT · SCR ' + score + ' · JMP ' + jumps,
    'vy ' + Math.round(vy) + (grounded ? ' · GROUND' : ' · AIR ' + (airMove || '-')) + ' · DBL ' + (doubleArmed ? 'ARM' : doubleUsed ? 'USED' : '-') + ' · TPL ' + (tripleUsed ? 'USED' : '-'),
    'WING ' + (wingOn ? String(wingKind).toUpperCase() + ' ' + wingT.toFixed(1) + '/' + wingMax + 's' : '-') + ' · FLUT ' + flutterT.toFixed(2) + ' · HANG ' + (hangPlat ? 'YES' : '-'),
    'MAG ' + (magOn ? magT.toFixed(1) + 's' : '-') + ' · COIN ' + (coinT > 0 ? coinT.toFixed(1) + 's' : '-') + ' · NOTES ' + notesGot + (noteCharge ? ' · FULLCHG' : ''),
    'AUD ' + (actx ? 'web-' + actx.state : 'element') + ' bufD ' + (bufD ? 'Y' : '-') + ' bufS ' + (bufS ? 'Y' : '-') + ' · el ' + (music && music.src ? music.src.split('/').pop() : '-') + ' ' + (music ? (music.paused ? 'PAUSED' : 'playing') + ' @' + (music.currentTime || 0).toFixed(1) : '-'),
    ghostTxt
  ];
  if (DBG_EV.length) lines.push('- EVENTS -', ...DBG_EV.slice(-4));
  $('dbg').textContent = lines.join('\n');
}
/* DEV FORK — THE NEW BEST CARD plumbing: the publish row lives in the card
   permanently (it only ever shows for world-board runs); the initials row
   moves in per-qualifier from gameOver and back out for local-only runs */
let nbHome = null;
function nbMove(node, toCard) { try { if (!node) return; if (toCard) { const b = $('nbIn'); if (b && b.appendChild) b.appendChild(node); } else if (nbHome && nbHome.p && nbHome.p.insertBefore) nbHome.p.insertBefore(node, nbHome.n); } catch (e) {} }
(function () { const nr = $('nameRow'); if (nr && nr.parentNode) nbHome = { p: nr.parentNode, n: nr.nextSibling }; nbMove($('pubRow'), true); })();

/* DEV FORK 7 — OPTION 1 ADS TEST (Keith, 2026-11-11): in-game ad
   monetization, tested fork-only with the Google TEST setup so nothing
   can draw an invalid-traffic flag. The rules, per his spec:
   - ZERO ads during active gameplay (the canvas stays 100% clear);
   - a REWARDED video on the WIPEOUT screen only, behind an explicit tap
     on WATCH AD TO REVIVE — one revive per run, granted only when the
     ad is watched to the end, respawning him on a safe cloud near where
     he fell with a 1.5 s float guard (sink capped, no fall death);
   - an INTERSTITIAL between runs, only behind the TRY AGAIN / MAIN MENU
     tap (never on the wipeout itself), capped at once per 3 runs AND
     at most once per 2 minutes;
   - NO banner (FORK 9, Keith: the bottom band clipped the WIPEOUT
     screen's buttons and 'will get hit while playing');
   - the game audio is HELD for the length of any ad (playTrack stands
     down) and re-asserted when it closes.
   Provider order: Google H5 Games Ads (adBreak) when the library has
   really loaded, else the built-in SIMULATED ad — so the whole flow is
   testable anywhere, and every step lands in the debug event log. */
window.adsbygoogle = window.adsbygoogle || [];
if (typeof window.adBreak !== 'function') window.adBreak = function (o) { window.adsbygoogle.push(o); };
if (typeof window.adConfig !== 'function') window.adConfig = function (o) { window.adsbygoogle.push(o); };
const AD = {
  runsSince: 0, lastAt: 0, busy: false,
  CAP_RUNS: 3, CAP_MS: 120000,
  log(s) { console.log('[6LOUD AD]', s); try { dbgLog('AD ' + s); } catch (e) {} },
  save() { try { localStorage.setItem('sixlouddev_ads', JSON.stringify({ runs: AD.runsSince, last: AD.lastAt })); } catch (e) {} },
  due() { return AD.runsSince >= AD.CAP_RUNS && (Date.now() - AD.lastAt) >= AD.CAP_MS; },
  holdAudio() { window.__adHold = true; try { if (actx && actx.state === 'running') actx.suspend(); } catch (e) {} try { if (music && !music.paused) music.pause(); } catch (e) {} AD.log('audio held'); },
  freeAudio() { window.__adHold = false; try { if (actx && actx.state === 'suspended') actx.resume(); } catch (e) {} try { playTrack(true); } catch (e) {} AD.log('audio free'); },
  h5(kind, done) {   /* true = handed to Google; done(null) = no fill, fall back to the SIM */
    if (!(window.adsbygoogle && window.adsbygoogle.loaded && typeof window.adBreak === 'function')) return false;
    let called = false, finished = false;
    const finish = v => { if (!finished) { finished = true; done(v); } };
    try {
      window.adBreak({ type: kind === 'rewarded' ? 'reward' : 'next', name: kind === 'rewarded' ? 'revive' : 'between-runs',
        beforeAd: () => { called = true; AD.log('google ad showing'); },
        adViewed: () => { AD.log('google ad viewed'); },
        adDismissed: () => { AD.log('google ad dismissed'); },
        adBreakDone: info => { const st = info && info.breakStatus; AD.log('google done: ' + st); if (!called) finish(null); else finish(kind === 'rewarded' ? st === 'viewed' : st !== 'error'); } });
    } catch (e) { return false; }
    setTimeout(() => { if (!called) finish(null); }, 2500);
    return true;
  },
  sim(kind, done) {
    const box = $('adSim'), close = $('adSimClose');
    $('adSimKind').textContent = kind === 'rewarded' ? 'REWARDED VIDEO' : 'INTERSTITIAL';
    $('adSimHint').textContent = kind === 'rewarded' ? 'Watch to the end — the revive lands when it finishes.' : 'Between-runs break. Cap: once per ' + AD.CAP_RUNS + ' runs, at most once per ' + (AD.CAP_MS / 60000) + ' min.';
    box.style.display = 'flex';
    const total = kind === 'rewarded' ? 5 : 3; let left = total, ended = false;
    const end = ok => { if (ended) return; ended = true; clearInterval(iv); box.style.display = 'none'; close.onclick = null; done(ok); };
    close.disabled = true; close.textContent = '✕'; $('adSimCount').textContent = Math.ceil(left) + 's'; $('adSimFill').style.width = '0%';
    const iv = setInterval(() => {
      left = Math.max(0, left - 0.1);
      $('adSimCount').textContent = left > 0 ? Math.ceil(left) + 's' : 'DONE';
      $('adSimFill').style.width = ((total - left) / total * 100) + '%';
      if (kind === 'rewarded' && left > 0 && left <= total - 1 && !close.onclick) { close.disabled = false; close.onclick = () => end(false); }   /* he may bail after 1 s — but a bailed ad pays no revive */
      if (left <= 0) { clearInterval(iv); close.disabled = false; close.textContent = kind === 'rewarded' ? 'CLAIM REVIVE ✕' : 'CLOSE ✕'; close.onclick = () => end(true); }
    }, 100);
    window.__adTestFinish = () => end(true);   /* forkcheck hook */
    AD.log('simulated ' + kind + ' showing');
  },
  show(kind, done) {
    if (AD.busy) return; AD.busy = true; AD.holdAudio(); AD.log(kind + ' requested');
    const finish = ok => { AD.busy = false; AD.freeAudio(); AD.log(kind + ' closed' + (ok ? ' (completed)' : ' (not completed)')); done(ok); };
    if (!AD.h5(kind, v => { if (v === null) AD.sim(kind, finish); else finish(v); })) AD.sim(kind, finish);
  },
  revive() {
    let cand = null;
    for (const p of plats) { if (p.x + p.len > px - 40 && p.x < px + 900 && (!cand || p.x < cand.x)) cand = p; }
    if (!cand) cand = plats[plats.length - 1];
    if (!cand) return false;
    px = Math.max(cand.x + 70, Math.min(px, cand.x + cand.len - 130));
    py = cand.y; vy = 0; grounded = cand;
    airMove = null; hangPlat = null; slipPlat = null; held = false; pressT = 0;
    flipped = false; flipMove = null; landMove = null; landT = 0; doubleArmed = false;
    dead = false; mode = 'run'; window.__adGuardT = 1.5;
    $('over').style.display = 'none';
    mScene = 'steps'; playTrack(true);
    AD.log('REVIVE granted — back on a cloud at ' + Math.round(runFt()) + ' FT, 1.5 s float guard');
    return true;
  }
};
window.__AD = AD;
try { const s = JSON.parse(localStorage.getItem('sixlouddev_ads') || '{}'); AD.runsSince = s.runs || 0; AD.lastAt = s.last || 0; } catch (e) {}
try { window.adConfig({ preloadAdBreaks: 'on' }); } catch (e) {}
$('reviveBtn').onclick = () => {
  if (AD.busy || window.__reviveUsed) return;
  AD.show('rewarded', ok => {
    if (ok) { window.__reviveUsed = true; if (!AD.revive()) $('reviveNote').textContent = 'NO SAFE CLOUD FOUND — REVIVE FAILED'; }
    else $('reviveNote').textContent = 'AD NOT FINISHED — NO REVIVE';
  });
};
/* the between-runs interstitial rides the two exits: a capture-phase
   listener takes the tap BEFORE the button's own handler, holds it
   while the ad plays, then re-fires the click so the normal save +
   exit flow runs untouched */
if (document.addEventListener) document.addEventListener('click', e => {
  if (window.__adBypass || AD.busy) return;
  const id = e.target && e.target.id;
  if ((id === 'again' || id === 'titleBtn') && typeof mode !== 'undefined' && mode === 'over' && AD.due()) {
    e.preventDefault(); e.stopPropagation();
    AD.show('interstitial', () => { AD.runsSince = 0; AD.lastAt = Date.now(); AD.save(); window.__adBypass = true; try { e.target.click(); } catch (err) {} window.__adBypass = false; });
  }
}, true);

function loop(ts) {
  const dt = Math.min(0.033, (ts - lastTs) / 1000 || 0.016); lastTs = ts;
  dbgTick(ts);   /* DEV FORK: the debug overlay rides the frame loop */
  tiltEase(dt);   /* the depth eases toward the phone's pose every frame, every mode (v0.83) */
  if (mode === 'title') titleFlow(dt);
  update(dt);
  const pu = !!hangPlat && !slipPlat;   /* PULL UP!! helper while he hangs (Keith v0.47) */
  if (pu !== puShown) { puShown = pu; $('pullup').style.display = pu ? 'block' : 'none'; }
  const db = !pu && mode === 'run' && (coinT > 0 ||   /* !pu (v0.97): the two helpers never show at once — Keith's 1,720 FT screenshot had AIR JUMP READY lit while he hung from a lip (the coin clause bypassed the hang check) */ (!grounded && !hangPlat && !slipPlat && ((doubleArmed && !doubleUsed) || (wingT > 0 && doubleUsed && !tripleUsed))));   /* AIR JUMP READY helper: while a mid-air tap would fire the double (Keith v0.70.1) — flashing for the whole coin charge (Keith v0.85) — and, v0.96/v0.97, while the wings' triple still waits behind a spent double */
  if (db !== dbShown) { dbShown = db; $('dbl').style.display = db ? 'block' : 'none'; }
  const cu = mode === 'title' && loadState === 'done';   /* the character select shows ONLY on a loaded title (Keith v0.73.2: during loading it crowded the bottom of the screen against the loading text; the START GAME button already waited for 'done' — now the arrows, name, best line and strip wait with it). It keeps its OWN flag (v0.65: borrowing another feature's flag kept it on every screen once) */
  if (cu !== charUiShown) { charUiShown = cu; $('charL').style.display = cu ? 'block' : 'none'; $('charR').style.display = cu ? 'block' : 'none'; $('selectStack').style.display = cu ? 'flex' : 'none'; $('strip').style.display = cu ? 'flex' : 'none'; }
  const sb = mode === 'title' && loadState === 'done';   /* START GAME shows only when the title is ready (v0.57) */
  if (sb !== sbShown) { sbShown = sb; $('startBtn').style.display = sb ? 'block' : 'none'; }
  const hd = mode !== 'over';   /* the DISTANCE plaque hides while the wipeout board is up (Keith 2026-11-07: it bled through behind WIPEOUT) */
  if (hd !== hudShown) { hudShown = hd; $('dist').style.display = hd ? 'block' : 'none'; }
  ghostUpdate(dt);   /* every mode: LaShmoove keeps his own time (v0.22) */ gateSteps(); gateDark();
  { let rainOn = false; for (const p of plats) { if ((p.dark || p.storm) && !p.gone && (p.sink || 0) <= 640 && p.x + p.len > camX && p.x < camX + viewW / zoom) { rainOn = true; break; }   /* v0.98: the storm decks count too — the watch used to wait for a true DARK deck only, so a run through storm banks (Keith's 1,846-3,321 FT runs) never cracked once */ } if (rainOn && !rainHeard) { playThunder(); rainHeard = true; } else if (!rainOn) rainHeard = false; }   /* v0.95 (Keith): 'when rain clouds show up on screen play this once for the group' — one crack when the dark clouds arrive in view, never per cloud, and the next group cracks again */
  audioBeat += dt;   /* THE AUDIO HEARTBEAT (v0.67, Keith: "after you die and come back the audio is muted even with it set to play"): every half second the live scene re-asserts its routing. Death, the initials keyboard, an app switch, a suspended context resuming a beat late — every one of those could strand the gains or the element on the wrong side of a boundary, and a boundary-only design stays stranded until the NEXT boundary. playTrack is idempotent, so re-asserting it twice a second costs nothing and no stuck state survives longer than half a second. */
  if (audioBeat > 0.5) { audioBeat = 0; if ((mode !== 'title' || titleMusicOn) && animLoaded >= animTotal) playTrack(); }   /* DEV FORK: the heartbeat also stands down while assets stream — the load window is where the chop was heard */
  draw();
  requestAnimationFrame(loop);
}
resize();
/* the title's BEST line was removed (Keith v0.20: "remove the txt at
   the front that says who has the high score") — the boards still live
   on the wipeout screen; the front stays clean. */
fetchBoard();
if (new URLSearchParams(location.search).has('over')) { $('over').style.display = 'flex'; $('nameRow').style.display = 'flex'; $('pubRow').style.display = 'flex'; }   /* DEV FORK layout hook: ?over=1 pins the WIPEOUT panel open so it can be checked at any window size / rotation */
if (new URLSearchParams(location.search).has('board')) setTimeout(openBoardPage, 2000);   /* DEV FORK layout hook: ?board=1 opens the full board once it has loaded */
requestAnimationFrame(loop);
</script>
