<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0f1a;color:#f1f5f9;font-family:-apple-system,sans-serif;width:600px;height:500px;padding:24px}
h1{font-size:20px;margin-bottom:4px}h1 span{color:#f0cd6e}
.sub{color:#94a3b8;font-size:13px;margin-bottom:16px}
.search{display:flex;gap:8px;margin-bottom:16px}
.search input{flex:1;background:#141b2e;border:1px solid #26314d;border-radius:8px;padding:10px;color:#fff;font-size:14px}
.search button{background:#f0cd6e;color:#0b0f1a;border:none;border-radius:8px;padding:10px 20px;font-weight:700}
.result{background:#141b2e;border:1px solid #26314d;border-radius:10px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.thumb{width:80px;height:60px;background:#26314d;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px}
.info{flex:1}.title{font-weight:700;font-size:14px}.artist{color:#94a3b8;font-size:12px}
.dl{background:#38bdf8;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-weight:700;font-size:13px}
</style></head><body>
<h1>📺 <span>CrateTube</span></h1>
<p class="sub">YouTube crate matcher — grab tracks for the booth</p>
<div class="search"><input value="Chronixx"><button>Search</button></div>
<div class="result"><div class="thumb">🎵</div><div class="info"><div class="title">Chronixx - Skankin' Sweet (Official Video)</div><div class="artist">YouTube · 4:32</div></div><button class="dl">⬇ MP3</button></div>
<div class="result"><div class="thumb">🎵</div><div class="info"><div class="title">Chronixx - Smile Jamaica (Official Video)</div><div class="artist">YouTube · 3:48</div></div><button class="dl">⬇ MP3</button></div>
<div class="result"><div class="thumb">🎵</div><div class="info"><div class="title">Protoje ft. Chronixx - Who Knows (Official Video)</div><div class="artist">YouTube · 4:15</div></div><button class="dl">⬇ MP3</button></div>
</body></html>
